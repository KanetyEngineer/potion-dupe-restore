name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create (e.g. v1.0.0). Leave empty to only build. A tag with "-" is a pre-release.'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.1' }
      - name: Build
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: potion-dupe
          path: build/libs/*.jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "Potion Dupe Restore $TAG (Minecraft 1.21.11)" --notes-file RELEASE_NOTES.md $([[ "$TAG" == *-* ]] && echo --prerelease)
