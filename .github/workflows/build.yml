name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.1' }
      - name: Build
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: potion-dupe
          path: build/libs/*.jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release create "$GITHUB_REF_NAME" "$JAR" --title "Potion Dupe Restore $GITHUB_REF_NAME (Minecraft 1.21.11)" --notes-file RELEASE_NOTES.md $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
